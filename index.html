<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b3a5c">
<title>Expense Reimbursement Form | JBCC</title>

<!-- 엑셀 처리 및 PDF 생성을 위한 라이브러리 -->
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

<style>
  *{box-sizing:border-box;}
  :root{
    --navy:#1b3a5c;
    --navy2:#2f6fb0;
    --bg:#eef1f5;
    --line:#dde4ec;
    --text:#16222e;
    --muted:#68788a;
    --danger:#c0392b;
    --radius:14px;
  }
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
      "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    font-size:16px;line-height:1.45;
    padding-bottom:calc(220px + env(safe-area-inset-bottom));
  }

  /* ---------- Header ---------- */
  .app-header{
    background:linear-gradient(140deg,#17324f,#2f6fb0);
    color:#fff;text-align:center;
    padding:calc(18px + env(safe-area-inset-top)) 16px 20px;
  }
  .app-header h1{margin:0 0 6px;font-size:13px;letter-spacing:.14em;font-weight:600;opacity:.92;}
  .app-header h2{margin:0;font-size:18px;font-weight:800;letter-spacing:.02em;}

  /* ---------- Cards ---------- */
  .card{
    background:#fff;margin:12px;border-radius:var(--radius);
    box-shadow:0 1px 4px rgba(16,32,48,.08);padding:16px;
  }
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
  .field:last-of-type{margin-bottom:0;}
  .field > label{
    font-size:11px;font-weight:800;letter-spacing:.07em;
    text-transform:uppercase;color:var(--muted);
  }
  .field > label .ko{font-weight:600;letter-spacing:0;text-transform:none;color:#9aa8b6;}
  input[type="text"],input[type="date"],input[type="number"]{
    width:100%;min-height:46px;padding:11px 12px;font-size:16px;
    font-family:inherit;color:var(--text);
    border:1px solid var(--line);border-radius:10px;background:#fff;
    -webkit-appearance:none;appearance:none;
  }
  input:focus{
    outline:none;border-color:var(--navy2);
    box-shadow:0 0 0 3px rgba(47,111,176,.15);
  }
  .paid-by{
    margin-top:16px;padding:10px 12px;border-radius:10px;
    background:#f4f7fb;font-size:13px;color:var(--muted);
  }
  .paid-by strong{color:var(--navy);}

  /* ---------- Table ---------- */
  .table-wrap{
    background:#fff;margin:12px;border-radius:var(--radius);
    box-shadow:0 1px 4px rgba(16,32,48,.08);overflow:hidden;
  }
  table{width:100%;border-collapse:collapse;table-layout:fixed;}
  thead th{
    background:#eef3f8;color:var(--navy);
    font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
    padding:11px 10px;text-align:left;white-space:nowrap;
    border-bottom:1px solid var(--line);
  }
  tbody td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:middle;}
  th.c-no,td.c-no{width:56px;text-align:center;}
  th.c-amt,td.c-amt{width:132px;}
  th.c-del,td.c-del{width:52px;text-align:center;}
  tbody input{
    width:100%;min-height:40px;padding:8px 10px;font-size:15px;
    font-family:inherit;color:var(--text);
    border:1px solid transparent;background:transparent;border-radius:8px;
    -webkit-appearance:none;appearance:none;
  }
  tbody input:hover{background:#f7fafd;}
  tbody input:focus{
    outline:none;background:#fff;border-color:var(--navy2);
    box-shadow:0 0 0 3px rgba(47,111,176,.15);
  }
  .in-amount{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;}

  .badge{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:26px;height:26px;padding:0 8px;border-radius:999px;
    background:var(--navy);color:#fff;font-size:12px;font-weight:700;
  }
  .btn-del{
    width:34px;height:34px;border-radius:9px;border:1px solid var(--line);
    background:#fff;color:var(--danger);font-size:15px;line-height:1;
    display:inline-flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .btn-del:active{background:#fdf0ee;}

  .add-row{
    display:block;width:100%;padding:15px;border:0;
    border-top:1px dashed var(--line);background:#fbfcfe;
    color:var(--navy2);font-size:15px;font-weight:700;font-family:inherit;
    cursor:pointer;
  }
  .add-row:active{background:#eef3f8;}

  /* 인쇄용 합계 행 (화면에서는 숨김) */
  tfoot{display:none !important;}
  tfoot td{
    padding:12px 10px;font-weight:800;color:var(--navy);
    border-top:2px solid var(--navy);
  }
  tfoot .t-label{text-align:right;letter-spacing:.04em;font-size:13px;}
  tfoot .t-value{text-align:right;font-variant-numeric:tabular-nums;}

  /* ---------- 서명 ---------- */
  .sign-card{display:grid;gap:10px;}
  .sign{
    display:flex;flex-direction:column;gap:3px;
    padding:12px 14px;background:#f4f7fb;border-radius:10px;
  }
  .sign span{font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);}
  .sign strong{font-size:15px;color:var(--navy);}

  /* ---------- 하단 고정 바 ---------- */
  .bottom-bar{
    position:fixed;left:0;right:0;bottom:0;z-index:50;
    background:#fff;border-top:1px solid var(--line);
    box-shadow:0 -4px 18px rgba(16,32,48,.10);
    padding:12px 12px calc(12px + env(safe-area-inset-bottom));
  }
  .total-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px;}
  .total-row span{font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--muted);}
  .total-row strong{font-size:22px;color:var(--navy);font-variant-numeric:tabular-nums;letter-spacing:-.01em;}
  
  /* 버튼 레이아웃 (4개 버튼에 맞게 수정) */
  .btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .btn-row button{
    padding:12px 6px;border-radius:10px;border:1px solid var(--line);
    background:#f6f9fc;color:var(--navy);font-size:13px;font-weight:700;
    font-family:inherit;cursor:pointer;
  }
  .btn-row button:active{transform:scale(.97);}
  .btn-row .primary{background:var(--navy);border-color:var(--navy);color:#fff;}
  .btn-row .full-width{grid-column: span 2;}

  /* ============ 모바일: 카드형 레이아웃 ============ */
  @media (max-width:700px){
    thead{display:none;}
    table,tbody,tr,td{display:block;width:100%;}
    tbody tr{
      position:relative;
      padding:14px 14px 2px;
      border-bottom:8px solid var(--bg);
    }
    tbody td{border:0;padding:0;margin:0 0 12px;}
    tbody td::before{
      content:attr(data-label);
      display:block;margin-bottom:6px;
      font-size:10.5px;font-weight:800;letter-spacing:.06em;
      text-transform:uppercase;color:var(--muted);
    }
    td.c-no,td.c-amt,td.c-del{width:auto !important;text-align:left;}
    td.c-no{margin-bottom:10px;}
    td.c-no::before{display:none;}
    td.c-del{position:absolute;top:10px;right:10px;margin:0;width:auto;}
    td.c-del::before{display:none;}
    tbody input{border-color:var(--line);background:#fff;}
    .in-amount{text-align:left;}
    .sign-card{grid-template-columns:1fr;}
  }
  @media (min-width:701px){
    .sign-card{grid-template-columns:1fr 1fr;}
    .bottom-bar{max-width:1000px;margin:0 auto;border-radius:0;}
  }

  /* ============ 인쇄 ============ */
  @page{margin:12mm;}
  @media print{
    body{background:#fff;padding:0;font-size:11px;}
    .no-print{display:none !important;}
    .app-header{background:#fff !important;color:#000 !important;padding:0 0 10px;border-bottom:2px solid #000;}
    .app-header h1{color:#000 !important;opacity:1;font-size:11px;}
    .app-header h2{color:#000 !important;font-size:15px;}
    .card,.table-wrap{box-shadow:none;border:1px solid #999;margin:10px 0;border-radius:0;padding:10px;}
    table{display:table !important;width:100%;table-layout:auto;}
    thead{display:table-header-group !important;}
    tbody{display:table-row-group !important;}
    tbody tr{display:table-row !important;padding:0 !important;border:0 !important;position:static !important;}
    th,td{display:table-cell !important;border:1px solid #999 !important;padding:5px 6px !important;}
    td::before{display:none !important;}
    thead th{background:#e8e8e8 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    tfoot{display:table-footer-group !important;}
    tbody input{border:0 !important;background:transparent !important;padding:0 !important;min-height:0 !important;box-shadow:none !important;}
    .badge{background:transparent !important;color:#000 !important;padding:0 !important;min-width:0 !important;height:auto !important;}
    .sign-card{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
    .sign{background:#f2f2f2 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .bottom-bar { display: none !important; }
  }
</style>
</head>
<body>

<header class="app-header">
  <h1>JESUS BAPTIST CALGARY CHURCH</h1>
  <h2>EXPENSE REIMBURSEMENT FORM</h2>
</header>

<!-- PDF로 만들 영역 (main 태그에 id 부여) -->
<main id="pdf-area">
  <!-- 기본 정보 -->
  <section class="card">
    <div class="field">
      <label for="requestedBy">Requested By <span class="ko">요청자</span></label>
      <input id="requestedBy" type="text" placeholder="이름을 입력하세요" autocomplete="name">
    </div>
    <div class="field">
      <label for="dateSubmitted">Date Submitted <span class="ko">제출일</span></label>
      <input id="dateSubmitted" type="date">
    </div>
    <div class="paid-by">Paid By : <strong>JESUS BAPTIST CALGARY CHURCH</strong></div>
  </section>

  <!-- 지출 내역 -->
  <section class="table-wrap">
    <table>
      <thead>
        <tr>
          <th class="c-no">No.</th>
          <th>Date</th>
          <th>Vendor</th>
          <th>Description / Purpose</th>
          <th class="c-amt">Amount (CAD $)</th>
          <th class="c-del no-print"></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
      <tfoot>
        <tr>
          <td colspan="4" class="t-label">TOTAL AMOUNT REQUESTED</td>
          <td class="t-value" id="totalPrint">$0.00</td>
          <td class="no-print"></td>
        </tr>
      </tfoot>
    </table>
    <button type="button" class="add-row no-print" id="btnAddRow">＋ 행 추가</button>
  </section>

  <!-- 서명 -->
  <section class="card sign-card">
    <div class="sign"><span>Verified By</span><strong>Insu Kim</strong></div>
    <div class="sign"><span>Approved By</span><strong>Jesus Baptist Calgary Church</strong></div>
  </section>
</main>

<!-- 하단 고정 바 -->
<div class="bottom-bar no-print">
  <div class="total-row">
    <span>TOTAL AMOUNT REQUESTED</span>
    <strong id="totalAmount">$0.00</strong>
  </div>
  <div class="btn-row">
    <!-- 새로 추가된 완료 버튼 (엑셀 + PDF) -->
    <button type="button" class="primary full-width" id="btnComplete">✅ 완료 (엑셀 저장 + PDF 생성)</button>
    
    <button type="button" id="btnPrint">인쇄 / PDF</button>
    <button type="button" id="btnCsv">CSV 저장</button>
    <button type="button" class="full-width" id="btnReset">초기화</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  var STORAGE_KEY = 'jbcc_expense_form_v1';
  var INITIAL_ROWS = 5;

  var tbody      = document.getElementById('tbody');
  var totalEl    = document.getElementById('totalAmount');
  var totalPrint = document.getElementById('totalPrint');
  var inRequested= document.getElementById('requestedBy');
  var inDateSub  = document.getElementById('dateSubmitted');

  /* ---------- 유틸 ---------- */
  function pad(n){ return String(n).padStart(2,'0'); }
  function todayStr(){
    var d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
  }
  function escAttr(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/"/g,'&quot;')
      .replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function parseAmt(v){
    var n = parseFloat(String(v).replace(/[^0-9.]/g,''));
    return isNaN(n) ? 0 : n;
  }
  function fmtAmt(n){
    return n.toLocaleString('en-CA',{minimumFractionDigits:2,maximumFractionDigits:2});
  }
  function sanitizeAmount(v){
    v = v.replace(/[^0-9.]/g,'');
    var i = v.indexOf('.');
    if (i !== -1) v = v.slice(0,i+1) + v.slice(i+1).replace(/\./g,'');
    return v;
  }
  function rowHasContent(tr){
    return ['in-vendor','in-desc','in-amount'].some(function(c){
      return tr.querySelector('.'+c).value.trim() !== '';
    });
  }

  /* ---------- 행 생성 ---------- */
  function createRow(data){
    data = data || {};
    var tr = document.createElement('tr');
    tr.innerHTML =
      '<td class="c-no" data-label="No."><span class="badge"></span></td>' +
      '<td data-label="Date"><input type="date" class="in-date" value="' + escAttr(data.date || '') + '"></td>' +
      '<td data-label="Vendor"><input type="text" class="in-vendor" placeholder="예: Costco" value="' + escAttr(data.vendor || '') + '"></td>' +
      '<td data-label="Description / Purpose"><input type="text" class="in-desc" placeholder="예: 주일 식사 준비" value="' + escAttr(data.desc || '') + '"></td>' +
      '<td class="c-amt" data-label="Amount (CAD $)"><input type="text" class="in-amount" inputmode="decimal" placeholder="0.00" value="' + escAttr(data.amount || '') + '"></td>' +
      '<td class="c-del no-print"><button type="button" class="btn-del" aria-label="행 삭제">✕</button></td>';
    return tr;
  }

  function addRow(data, silent){
    var tr = createRow(data);
    tbody.appendChild(tr);
    if (!silent) renumber();
    return tr;
  }

  function renumber(){
    Array.prototype.forEach.call(tbody.children, function(tr, i){
      tr.querySelector('.badge').textContent = i + 1;
    });
  }

  /* ---------- 합계 ---------- */
  function updateTotal(){
    var sum = 0;
    Array.prototype.forEach.call(tbody.querySelectorAll('.in-amount'), function(inp){
      sum += parseAmt(inp.value);
    });
    var txt = '$' + fmtAmt(sum);
    totalEl.textContent = txt;
    totalPrint.textContent = txt;
    return sum;
  }

  /* ---------- 저장 / 복원 ---------- */
  function collect(){
    return Array.prototype.map.call(tbody.children, function(tr){
      return {
        date  : tr.querySelector('.in-date').value,
        vendor: tr.querySelector('.in-vendor').value,
        desc  : tr.querySelector('.in-desc').value,
        amount: tr.querySelector('.in-amount').value
      };
    });
  }

  var saveTimer = null;
  function save(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          requestedBy  : inRequested.value,
          dateSubmitted: inDateSub.value,
          rows         : collect()
        }));
      } catch (e) { /* 저장 실패 무시 */ }
    }, 250);
  }

  function load(){
    var data = null;
    try { data = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch (e) { data = null; }

    if (data && Array.isArray(data.rows) && data.rows.length) {
      inRequested.value = data.requestedBy || '';
      inDateSub.value   = data.dateSubmitted || todayStr();
      data.rows.forEach(function(r){ addRow(r, true); });
      renumber();
      if (rowHasContent(tbody.lastElementChild)) addRow({}, true);
      renumber();
    } else {
      inDateSub.value = todayStr();
      for (var i = 0; i < INITIAL_ROWS; i++) addRow({}, true);
      renumber();
    }
    updateTotal();
  }

  /* ---------- 이벤트: 입력 ---------- */
  tbody.addEventListener('input', function(e){
    var t = e.target;
    var tr = t.closest('tr');
    if (!tr) return;

    if (t.classList.contains('in-amount')) {
      var pos = t.selectionStart;
      var before = t.value.length;
      t.value = sanitizeAmount(t.value);
      var after = t.value.length;
      if (pos !== null && before !== after) {
        t.setSelectionRange(Math.max(0, pos - (before - after)), Math.max(0, pos - (before - after)));
      }
    }

    // 날짜 자동 입력 (해당 행에 처음 내용이 들어올 때 1회)
    if (!tr.dataset.touched && rowHasContent(tr)) {
      tr.dataset.touched = '1';
      var d = tr.querySelector('.in-date');
      if (!d.value) d.value = todayStr();
    }

    updateTotal();
    save();

    // 마지막 행에 입력하면 빈 행 자동 추가
    if (tr === tbody.lastElementChild && rowHasContent(tr)) {
      addRow({}, true);
      renumber();
    }
  });

  /* 금액: 포커스 시 콤마 제거 → 블러 시 콤마 포맷 */
  tbody.addEventListener('focusin', function(e){
    if (e.target.classList.contains('in-amount')) {
      var n = parseAmt(e.target.value);
      e.target.value = n ? String(n) : '';
      if (n) { try { e.target.select(); } catch (err) {} }
    }
  });

  tbody.addEventListener('focusout', function(e){
    if (e.target.classList.contains('in-amount')) {
      var n = parseAmt(e.target.value);
      e.target.value = n ? fmtAmt(n) : '';
      updateTotal();
      save();
    }
  });

  /* ---------- 이벤트: 삭제 ---------- */
  tbody.addEventListener('click', function(e){
    var btn = e.target.closest('.btn-del');
    if (!btn) return;
    var tr = btn.closest('tr');
    tr.remove();
    if (!tbody.children.length) addRow({}, true);
    renumber();
    updateTotal();
    save();
  });

  /* ---------- 이벤트: 상단 필드 ---------- */
  inRequested.addEventListener('input', save);
  inDateSub.addEventListener('change', save);

  /* ---------- 행 추가 버튼 ---------- */
  document.getElementById('btnAddRow').addEventListener('click', function(){
    var tr = addRow({}, true);
    renumber();
    var target = tr.querySelector('.in-vendor');
    target.scrollIntoView({behavior:'smooth', block:'center'});
    setTimeout(function(){ target.focus(); }, 300);
  });

  /* ---------- 인쇄 ---------- */
  document.getElementById('btnPrint').addEventListener('click', function(){
    window.print();
  });
  window.addEventListener('beforeprint', function(){
    Array.prototype.forEach.call(tbody.querySelectorAll('.in-date'), function(i){
      if (!i.value) { i.dataset.empty = '1'; i.style.color = 'transparent'; }
    });
  });
  window.addEventListener('afterprint', function(){
    Array.prototype.forEach.call(tbody.querySelectorAll('.in-date[data-empty]'), function(i){
      i.style.color = ''; delete i.dataset.empty;
    });
  });

  /* ---------- CSV ---------- */
  function csvCell(v){
    return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  }
  document.getElementById('btnCsv').addEventListener('click', function(){
    var lines = [];
    lines.push(['JESUS BAPTIST CALGARY CHURCH'].map(csvCell).join(','));
    lines.push(['EXPENSE REIMBURSEMENT FORM'].map(csvCell).join(','));
    lines.push('');
    lines.push(['Requested By', inRequested.value, 'Date Submitted', inDateSub.value].map(csvCell).join(','));
    lines.push(['Paid By', 'JESUS BAPTIST CALGARY CHURCH'].map(csvCell).join(','));
    lines.push('');
    lines.push(['No.','Date','Vendor','Description / Purpose','Amount (CAD $)'].map(csvCell).join(','));

    var total = 0, no = 0;
    Array.prototype.forEach.call(tbody.children, function(tr){
      var date   = tr.querySelector('.in-date').value;
      var vendor = tr.querySelector('.in-vendor').value.trim();
      var desc   = tr.querySelector('.in-desc').value.trim();
      var amtStr = tr.querySelector('.in-amount').value.trim();
      if (!vendor && !desc && !amtStr) return;
      var amt = parseAmt(amtStr);
      total += amt;
      no += 1;
      lines.push([no, date, vendor, desc, amt.toFixed(2)].map(csvCell).join(','));
    });

    lines.push('');
    lines.push(['TOTAL AMOUNT REQUESTED','','','', total.toFixed(2)].map(csvCell).join(','));

    var blob = new Blob(['\uFEFF' + lines.join('\r\n')], {type:'text/csv;charset=utf-8;'});
    var url  = URL.createObjectURL(blob);
    var a    = document.createElement('a');
    a.href = url;
    a.download = 'JBCC_Expense_Reimbursement_' + todayStr() + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  });

  /* ---------- 초기화 ---------- */
  document.getElementById('btnReset').addEventListener('click', function(){
    if (!confirm('입력한 내용을 모두 지우고 새로 시작할까요?')) return;
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    tbody.innerHTML = '';
    inRequested.value = '';
    inDateSub.value = todayStr();
    for (var i = 0; i < INITIAL_ROWS; i++) addRow({}, true);
    renumber();
    updateTotal();
    window.scrollTo({top:0, behavior:'smooth'});
  });

  /* ==========================================================
     ★★★ 새로 추가된 기능: 완료 버튼 (엑셀 채우기 + PDF 생성) ★★★
     ========================================================== */
  document.getElementById('btnComplete').addEventListener('click', async function() {
    const btn = this;
    const originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = '⏳ 처리 중...';

    try {
      // 1. 현재 폼 데이터 수집
      const requestedBy = inRequested.value.trim();
      const dateSubmitted = inDateSub.value;

      const rows = [];
      Array.prototype.forEach.call(tbody.children, function(tr) {
        const date = tr.querySelector('.in-date').value;
        const vendor = tr.querySelector('.in-vendor').value.trim();
        const desc = tr.querySelector('.in-desc').value.trim();
        const amount = tr.querySelector('.in-amount').value.trim();

        if (vendor || desc || amount) {
          rows.push({ date, vendor, desc, amount });
        }
      });

      if (!requestedBy) {
        alert('Requested By (요청자) 이름을 입력해주세요.');
        return;
      }

      // 2. 엑셀 템플릿 불러오기 (GitHub에 업로드한 파일명과 일치해야 함)
      const templateUrl = './JBCC_Expense_Reimbursement_Form.xlsx';
      const response = await fetch(templateUrl);
      
      if (!response.ok) {
        throw new Error('엑셀 템플릿을 불러올 수 없습니다. GitHub에 JBCC_Expense_Reimbursement_Form.xlsx 파일이 업로드되어 있는지 확인해주세요.');
      }
      
      const arrayBuffer = await response.arrayBuffer();

      // 3. SheetJS로 엑셀 파일 읽기
      const workbook = XLSX.read(arrayBuffer, { type: 'array' });
      const sheetName = workbook.SheetNames[0];
      const worksheet = workbook.Sheets[sheetName];

      // 4. 셀에 데이터 채우기 (제공해주신 엑셀 구조에 맞춤)
      // 12행: Requested By (B12), Date Submitted (E12)
      if (requestedBy) worksheet['B12'] = { v: requestedBy, t: 's' };
      if (dateSubmitted) worksheet['E12'] = { v: dateSubmitted, t: 's' };

      // 16행부터 35행까지 데이터 채우기 (총 20개 행)
      const startRow = 16;
      for (let i = 0; i < 20; i++) {
        const rowNum = startRow + i;
        if (i < rows.length) {
          const rowData = rows[i];
          worksheet['A' + rowNum] = { v: i + 1, t: 'n' }; // No.
          if (rowData.date) worksheet['B' + rowNum] = { v: rowData.date, t: 's' };
          if (rowData.vendor) worksheet['C' + rowNum] = { v: rowData.vendor, t: 's' };
          if (rowData.desc) worksheet['D' + rowNum] = { v: rowData.desc, t: 's' };
          if (rowData.amount) worksheet['E' + rowNum] = { v: parseFloat(rowData.amount.replace(/,/g, '')), t: 'n' };
        } else {
          // 남은 빈 행은 빈 값으로 초기화
          worksheet['A' + rowNum] = { v: '', t: 's' };
          worksheet['B' + rowNum] = { v: '', t: 's' };
          worksheet['C' + rowNum] = { v: '', t: 's' };
          worksheet['D' + rowNum] = { v: '', t: 's' };
          worksheet['E' + rowNum] = { v: '', t: 's' };
        }
      }

      // 5. 채워진 엑셀 파일 다운로드
      const excelBuffer = XLSX.write(workbook, { bookType: 'xlsx', type: 'array' });
      const excelBlob = new Blob([excelBuffer], { type: 'application/octet-stream' });
      const fileName = `JBCC_Expense_${dateSubmitted || todayStr()}`;
      saveAs(excelBlob, `${fileName}.xlsx`);

      // 6. PDF 생성 (pdf-area 영역을 PDF로 변환)
      const element = document.getElementById('pdf-area');
      const opt = {
        margin:       [10, 5, 10, 5], // top, right, bottom, left (mm)
        filename:     `${fileName}.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
        pagebreak:    { mode: ['avoid-all', 'css', 'legacy'] }
      };
      
      await html2pdf().set(opt).from(element).save();

      alert('✅ 엑셀 파일과 PDF 파일이 성공적으로 다운로드되었습니다!');

    } catch (error) {
      console.error('오류 발생:', error);
      alert('파일 처리 중 오류가 발생했습니다.\n\n' + error.message);
    } finally {
      btn.disabled = false;
      btn.textContent = originalText;
    }
  });

  /* ---------- 시작 ---------- */
  load();
})();
</script>
</body>
</html>
